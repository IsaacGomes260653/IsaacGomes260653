name: atualiza a atividade recente

on:
  schedule:
    - cron: "30 */12 * * *" # a cada 12h (09:30 e 21:30 em Brasília)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/atividade.py
      - .github/workflows/atividade.yml

permissions:
  contents: write # commit do README

# Mesmo grupo do painel-estudos.yml: os dois reescrevem o README no main, então
# um espera o outro terminar em vez de brigarem no push.
concurrency:
  group: readme-main
  cancel-in-progress: false

jobs:
  atividade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: autoteste
        run: python3 .github/scripts/atividade.py --teste

      # Só a API de eventos públicos: nada de repositório privado aparece.
      - name: gera a lista
        run: python3 .github/scripts/atividade.py

      # Sem atividade nova, a lista sai igual e não há commit.
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualiza atividade recente"
          git pull --rebase
          git push
