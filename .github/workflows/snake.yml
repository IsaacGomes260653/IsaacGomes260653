name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: IsaacGomes260653
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-flamengo.svg?color_snake=%23e30613&color_dots=%230d0d0d,%233a0000,%23750000,%23b30000,%23e30613
            dist/github-snake-indigo.svg?color_snake=%234f46e5&color_dots=%23ebedf0,%23c7d2fe,%23a5b4fc,%236366f1,%234338ca
            dist/github-snake-indigo-dark.svg?palette=github-dark&color_snake=%23818cf8&color_dots=%23161b22,%23312e81,%234338ca,%236366f1,%23818cf8

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          force_orphan: true
