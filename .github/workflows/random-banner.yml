name: randomize footer

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Mesmo grupo do painel-estudos.yml: os dois reescrevem o README no main.
concurrency:
  group: readme-main
  cancel-in-progress: false

jobs:
  randomize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: pick a random theme
        id: pick
        run: |
          # O cabeçalho agora é o banner próprio (assets/banner); só o rodapé
          # é sorteado. Cada linha: type|gradiente escuro|gradiente claro|animation,
          # nos tons de azul-marinho e azulejo do banner.
          # type fixo em "waving" (a de ondas) -- foi a forma que o usuario
          # gostou originalmente; "soft"/"cylinder"/"rounded" ficam mais
          # "retangulares" e foram descartadas por feedback dele.
          themes=(
            "waving|0:16223d,100:22314f|0:e6eaf2,100:f5f6f9|fadeIn"
            "waving|0:22314f,100:16223d|0:f5f6f9,100:e6eaf2|twinkling"
            "waving|0:16223d,50:22314f,100:16223d|0:eceff5,50:e6eaf2,100:eceff5|scaleIn"
          )
          choice=${themes[$RANDOM % ${#themes[@]}]}
          IFS='|' read -r type dark light animation <<< "$choice"

          # Vírgula vira %2C: o GitHub corta o srcset do <source> nas vírgulas,
          # e o gradiente do tema escuro chegava pela metade (cor inválida, preto).
          base="https://capsule-render.vercel.app/api?type=${type}&height=100&section=footer&animation=${animation}"
          echo "footer_dark=${base}&color=${dark//,/%2C}" >> "$GITHUB_OUTPUT"
          echo "footer_light=${base}&color=${light//,/%2C}" >> "$GITHUB_OUTPUT"
          echo "Picked: $type / $dark / $light / $animation"

      - name: update README footer
        env:
          FOOTER_DARK: ${{ steps.pick.outputs.footer_dark }}
          FOOTER_LIGHT: ${{ steps.pick.outputs.footer_light }}
        run: |
          python3 - <<'PYEOF'
          import os, re

          footer_tag = (
              "<picture>\n"
              f'  <source media="(prefers-color-scheme: dark)" srcset="{os.environ["FOOTER_DARK"]}">\n'
              f'  <img src="{os.environ["FOOTER_LIGHT"]}" alt="Rodapé decorativo em ondas / Decorative wave footer">\n'
              "</picture>"
          )

          with open("README.md", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r'(<!--START_SECTION:footer-->\n).*?(\n<!--END_SECTION:footer-->)',
              lambda m: m.group(1) + footer_tag + m.group(2),
              content,
              flags=re.S,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: rotate footer"
          git pull --rebase
          git push
