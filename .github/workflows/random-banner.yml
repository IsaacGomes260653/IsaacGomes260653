name: randomize banner

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  randomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pick a random theme
        id: pick
        run: |
          # cada linha: type|color-gradient|animation
          themes=(
            "waving|0:4f46e5,100:9333ea|fadeIn"
            "venom|0:0ea5e9,100:22d3ee|scaleIn"
            "soft|0:ec4899,100:f97316|twinkling"
            "slice|0:10b981,100:06b6d4|fadeIn"
            "blur|0:8b5cf6,100:ec4899|twinkling"
            "rounded|0:3b82f6,100:6366f1|scaleIn"
            "wave|0:f59e0b,100:ef4444|fadeIn"
          )
          choice=${themes[$RANDOM % ${#themes[@]}]}
          IFS='|' read -r type color animation <<< "$choice"

          header_url="https://capsule-render.vercel.app/api?type=${type}&color=${color}&height=170&section=header&text=Isaac%20Gomes%20de%20Moraes&fontColor=ffffff&fontSize=38&animation=${animation}"
          footer_url="https://capsule-render.vercel.app/api?type=${type}&color=${color}&height=100&section=footer&animation=${animation}"

          echo "header_url=$header_url" >> "$GITHUB_OUTPUT"
          echo "footer_url=$footer_url" >> "$GITHUB_OUTPUT"
          echo "Picked: $type / $color / $animation"

      - name: update README banner and footer
        env:
          HEADER_URL: ${{ steps.pick.outputs.header_url }}
          FOOTER_URL: ${{ steps.pick.outputs.footer_url }}
        run: |
          python3 - <<'PYEOF'
          import os, re

          header_tag = f'<img src="{os.environ["HEADER_URL"]}" alt="header">'
          footer_tag = f'<img src="{os.environ["FOOTER_URL"]}" alt="footer">'

          with open("README.md", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r'(<!--START_SECTION:banner-->\n).*?(\n<!--END_SECTION:banner-->)',
              lambda m: m.group(1) + header_tag + m.group(2),
              content,
              flags=re.S,
          )
          content = re.sub(
              r'(<!--START_SECTION:footer-->\n).*?(\n<!--END_SECTION:footer-->)',
              lambda m: m.group(1) + footer_tag + m.group(2),
              content,
              flags=re.S,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: rotate banner"
          git push
