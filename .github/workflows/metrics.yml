name: generate activity graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: metrics.plugin.isocalendar.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update activity graph"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          filename: metrics.plugin.languages.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update top languages"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          filename: metrics.plugin.achievements.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update achievements"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_skyline: yes
          plugin_skyline_quality: 0.5
          filename: metrics.plugin.skyline.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update skyline"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_lines: yes
          plugin_lines_sections: history
          filename: metrics.plugin.lines.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update lines of code"
