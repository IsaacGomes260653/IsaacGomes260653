name: generate activity graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: metrics.plugin.isocalendar.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update activity graph"

      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          filename: metrics.plugin.languages.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update top languages"

      # Atividade recente (seção Agora do README). Só eventos públicos, para
      # não expor repositórios privados, e sem criação/remoção de branch, que
      # com o fluxo de branch + PR viraria ruído.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes
          plugin_activity_filter: push, pr, review, issue, release, public
          filename: metrics.plugin.activity.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update recent activity"
