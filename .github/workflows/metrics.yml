name: generate activity graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: metrics.plugin.isocalendar.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update activity graph"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          filename: metrics.plugin.languages.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update top languages"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          filename: metrics.plugin.achievements.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update achievements"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_lines: yes
          plugin_lines_sections: history
          filename: metrics.plugin.lines.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update lines of code"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4
          filename: metrics.plugin.stars.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update recently starred"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_fortune: yes
          filename: metrics.plugin.fortune.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update fortune"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_screenshot: yes
          plugin_screenshot_title: "Álbum da Copa"
          plugin_screenshot_url: https://isaacgomes260653.github.io/Album-da-copa/
          filename: metrics.plugin.screenshot.album.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update album-da-copa screenshot"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_screenshot: yes
          plugin_screenshot_title: "PlayHub"
          plugin_screenshot_url: https://isaacgomes260653.github.io/CEUB_CIENCIA_2026/
          filename: metrics.plugin.screenshot.playhub.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update playhub screenshot"
