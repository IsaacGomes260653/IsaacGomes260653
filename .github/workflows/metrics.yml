name: generate activity graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: metrics.plugin.isocalendar.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update activity graph"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          filename: metrics.plugin.languages.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update top languages"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_lines: yes
          plugin_lines_sections: history
          filename: metrics.plugin.lines.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update lines of code"

      - name: checkout output-metrics branch
        uses: actions/checkout@v4
        with:
          ref: output-metrics
          path: patch-repo

      - name: widen diff history chart (avoid month label clipping)
        run: |
          cd patch-repo
          python3 - <<'PYEOF'
          import re

          # The lines plugin hardcodes the "Diff history" chart at width=480
          # (source/plugins/lines/index.mjs, no config option for it), so the
          # longest month label ("September") gets clipped. Two boundaries
          # need widening, not just one: the inner chart <svg> (its own
          # canvas) AND the outer card <svg> that wraps the whole file --
          # nested/root SVGs clip to their own width by default, so the
          # outer one clips the inner one's extra room right back off if
          # left untouched.
          with open("metrics.plugin.lines.svg", encoding="utf-8") as f:
              content = f.read()

          content, n_outer = re.subn(
              r'(<svg xmlns="http://www\.w3\.org/2000/svg" width=")480(" height="\d+" class="[^"]*">)',
              r'\g<1>680\g<2>',
              content,
              count=1,
          )
          content, n_inner = re.subn(
              r'<svg xmlns="http://www\.w3\.org/2000/svg" width="480" height="315">',
              '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="315">',
              content,
          )
          assert n_outer == 1, f"outer card svg width tag not found/patched ({n_outer} matches)"
          assert n_inner == 1, f"inner chart svg width tag not found/patched ({n_inner} matches)"

          with open("metrics.plugin.lines.svg", "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.plugin.lines.svg
          git diff --cached --quiet || git commit -m "chore: widen diff history chart to avoid label clipping"
          git push

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4
          filename: metrics.plugin.stars.svg
          output_action: commit
          committer_branch: output-metrics
          committer_message: "chore: update recently starred"
