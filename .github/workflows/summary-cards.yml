name: generate summary cards

# Gera o painel de estatísticas do README (contribuições, sequências, commits,
# PRs e repositórios) pelo estatisticas.py, com as cores do brand/tokens.json,
# nas versões desktop e celular, clara e escura, no branch output-stats.

on:
  schedule:
    - cron: "30 */6 * * *" # a cada 6h
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Os números vêm do mesmo calendário do perfil (com as contribuições
      # privadas, anônimas) e das mesmas consultas do card antigo de estatísticas.
      - name: generate the stats panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 .github/scripts/estatisticas.py --teste
          python3 .github/scripts/estatisticas.py out

      - name: push to the output-stats branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          # Na prévia, publica à parte, sem mexer no que está no ar.
          publish_branch: ${{ github.ref_name == 'main' && 'output-stats' || 'output-stats-previa' }}
          force_orphan: true
