              - { nome: "Redirecting constructors", url: "https://dart.dev/language/constructors#redirecting-constructors" }
              - { nome: "Factory constructors", url: "https://dart.dev/language/constructors#factory-constructors" }
              - { nome: "Super parameters", url: "https://dart.dev/language/constructors#super-parameters" }
