# estudos.yml — Roadmap de estudos / Study roadmap
# Para atualizar: no subtema que você estudou, mude o "status" (ou escreva um, se não tiver)
# e faça commit — dá até para editar aqui pelo lápis do GitHub. O README se atualiza sozinho.
#   Ex.: - { nome: "Final and const", status: concluido, estrela: true, url: "..." }
# Quando a etapa inteira mudar de fase, mude também o "status" da etapa.
# status aceitos: estudando | a_comecar | pausado | concluido
# Subtema sem status = a_comecar. Grupo (subtema com "itens") não tem status: ele sai dos itens.
# estrela: true = exigido no plano da empresa (⭐). "url" e "preco" são opcionais.
# codigo: link para o código do estudo (opcional); aparece como "código / code" no README.
# Campos vazios ou ausentes NÃO aparecem no README.
# Atalho: marcar as caixinhas da issue do painel (link abaixo) atualiza este arquivo sozinho.

painel: "https://github.com/IsaacGomes260653/IsaacGomes260653/issues/14"

trilhas:
  - id: flutter
    titulo:
      pt: "Rumo ao Flutter — preparação para o novo emprego"
      en: "Road to Flutter — getting ready for my new job"
    curto: { pt: "Rumo ao Flutter", en: "Road to Flutter" }   # título da imagem do roadmap
    etapas:
      - numero: 1
        titulo: { pt: "Lógica e sintaxe em Dart", en: "Dart logic and syntax" }
        status: estudando
        conteudo:
          pt: "Variáveis e tipos (int, double, String, bool, List, Map), operadores aritméticos, comparativos e lógicos, if/else, switch, for, while e funções com parâmetros posicionais e nomeados."
          en: "Variables and types (int, double, String, bool, List, Map), arithmetic, comparison and logical operators, if/else, switch, for, while, and functions with positional and named parameters."
