              - { nome: "Sets", url: "https://dart.dev/language/collections#sets" }
              - { nome: "Maps", estrela: true, url: "https://dart.dev/language/collections#maps" }
              - { nome: "Collection elements", url: "https://dart.dev/language/collections#collection-elements" }
          - nome: "Operators"
            url: "https://dart.dev/language/operators"
            itens:
              - { nome: "Operator precedence", url: "https://dart.dev/language/operators#operator-precedence-example" }
              - { nome: "Arithmetic operators", estrela: true, url: "https://dart.dev/language/operators#arithmetic-operators" }
              - { nome: "Equality and relational operators", estrela: true, url: "https://dart.dev/language/operators#equality-and-relational-operators" }
              - { nome: "Type test operators", url: "https://dart.dev/language/operators#type-test-operators" }
              - { nome: "Assignment operators", url: "https://dart.dev/language/operators#assignment-operators" }
              - { nome: "Logical operators", estrela: true, url: "https://dart.dev/language/operators#logical-operators" }
              - { nome: "Bitwise and shift operators", url: "https://dart.dev/language/operators#bitwise-and-shift-operators" }
              - { nome: "Conditional expressions", url: "https://dart.dev/language/operators#conditional-expressions" }
