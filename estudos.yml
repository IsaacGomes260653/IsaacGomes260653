              - { nome: "Strings", estrela: true, url: "https://dart.dev/language/built-in-types#strings" }
              - { nome: "Booleans", estrela: true, url: "https://dart.dev/language/built-in-types#booleans" }
              - { nome: "Runes and grapheme clusters", url: "https://dart.dev/language/built-in-types#runes-and-grapheme-clusters" }
              - { nome: "Symbols", url: "https://dart.dev/language/built-in-types#symbols" }
          - nome: "Collections"
            url: "https://dart.dev/language/collections"
